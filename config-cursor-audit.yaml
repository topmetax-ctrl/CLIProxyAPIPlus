host: '0.0.0.0'
port: 8317
auth-dir: '~/.cli-proxy-api'
remote-management:
  allow-remote: false
  secret-key: '$2a$10$WTTTGcZAIz9t0ZyX4yyiUOvsPk9FAqxNig.X78VLpB4c1pYZquMvW'
  disable-auto-update-panel: true
api-keys:
  - 'audit-local-key-1'
# Single-account setup: a watchdog 504 or transient upstream failure must not
